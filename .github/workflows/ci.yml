name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests, lint, debug and release builds
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v5

      # The JDK gradle/gradle-daemon-jvm.properties asks for: JetBrains
      # Runtime 17. (Given another JDK, Gradle would download that one itself.)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: '17'
        env:
          # The JetBrains installer looks up releases through the GitHub API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default package list still includes the removed "tools"
          # package, which fails the step.
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Deliberately no local.properties, key.properties or secrets: the
      # build falls back to an empty TMDB key and an unsigned release. Don't
      # add the real key here either; anyone who can read this public repo
      # can download the APK artifact below.
      - name: Test, lint and build
        run: ./gradlew --stacktrace testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest

      # Release builds run R8 (minifyEnabled, shrinkResources), a different
      # path from debug: a new library or a model class without keep rules
      # breaks here first. Without key.properties the APK is left unsigned.
      # This proves the rules build, not that the shrunk app runs: Jackson
      # and Retrofit still need a check on a device.
      - name: Release build (R8, unsigned)
        run: ./gradlew --stacktrace assembleRelease

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/mapping/release/missing_rules.txt
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
