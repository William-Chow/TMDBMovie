// Release signing is optional. key.properties is never committed (copy
// key.properties.example); without it, or when the keystore it names does not
// exist, release builds come out unsigned, so CI and fresh clones need no
// secrets.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseStoreFile = keystoreProperties['storeFile'] ?
        rootProject.file(keystoreProperties['storeFile']) : null
def hasReleaseSigning = releaseStoreFile != null && releaseStoreFile.exists()
if (keystorePropertiesFile.exists() && !hasReleaseSigning) {
    logger.warn("key.properties does not point at an existing storeFile; " +
            "release builds will be unsigned.")
}

// The TMDB key is not tracked. It comes from local.properties (tmdb.apiKey,
// or TMDB_API_KEY) or from a TMDB_API_KEY environment variable, such as a CI
// secret. Without one the app still builds (CI needs no secrets) and tells
// the user at runtime that the key is missing.
def localPropertiesFile = rootProject.file("local.properties")
def localProperties = new Properties()
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def tmdbApiKey = (localProperties.getProperty('tmdb.apiKey') ?:
        localProperties.getProperty('TMDB_API_KEY') ?:
        System.getenv('TMDB_API_KEY') ?: '').trim()

android {
    namespace 'com.movielist.tmdb'
    // 36, not 37: the API 37 platform needs AGP 9.1+, and this build uses 8.12.
    compileSdk = 36

    defaultConfig {
        applicationId "com.movielist.tmdb"
        minSdk 28
        targetSdk 36
        versionCode 4
        versionName "3.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "TMDB_API_KEY", "\"${tmdbApiKey}\""
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile = releaseStoreFile
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // Google's sample AdMob app and ad units: they always fill, and
            // clicks while developing never count against the real account.
            resValue "string", "admob_id", "ca-app-pub-3940256099942544~3347511713"
            resValue "string", "admob_banner_ad_unit_id", "ca-app-pub-3940256099942544/6300978111"
            resValue "string", "admob_interstitial_ad_unit_id", "ca-app-pub-3940256099942544/1033173712"
        }
        release {
            resValue "string", "admob_id", "ca-app-pub-4541063798492496~7778027755"
            resValue "string", "admob_banner_ad_unit_id", "ca-app-pub-4541063798492496/9305326872"
            resValue "string", "admob_interstitial_ad_unit_id", "ca-app-pub-4541063798492496/3290582868"
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

