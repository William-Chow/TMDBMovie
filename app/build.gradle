// Release signing is optional. key.properties is never committed (copy
// key.properties.example); without it, or when the keystore it names does not
// exist, release builds come out unsigned, so CI and fresh clones need no
// secrets.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseStoreFile = keystoreProperties['storeFile'] ?
        rootProject.file(keystoreProperties['storeFile']) : null
def hasReleaseSigning = releaseStoreFile != null && releaseStoreFile.exists()
if (keystorePropertiesFile.exists() && !hasReleaseSigning) {
    logger.warn("key.properties does not point at an existing storeFile; " +
            "release builds will be unsigned.")
}

// The TMDB key lives in local.properties, which is not tracked. A checkout
// without one still builds; requests then fail with a plain 401.
def localPropertiesFile = rootProject.file("local.properties")
def localProperties = new Properties()
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    namespace 'com.movielist.tmdb'
    compileSdk = 37

    defaultConfig {
        applicationId "com.movielist.tmdb"
        minSdk 28
        targetSdk 36
        versionCode 3
        versionName "3.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "TMDB_API_KEY",
                "\"${localProperties.getProperty('tmdb.apiKey', '')}\""
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile = releaseStoreFile
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

